<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de documentação — terrenos Carvalho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-0: #0A0E1A;
    --bg-1: #0F1424;
    --card: rgba(255, 255, 255, 0.045);
    --card-solid: #131A2E;
    --border: rgba(255, 255, 255, 0.09);
    --border-strong: rgba(255, 255, 255, 0.16);
    --text: #EAEDF7;
    --text-secondary: #9CA3C0;
    --text-muted: #6C7395;
    --accent: #7C9CFF;
    --accent-2: #B98CF2;
    --danger-bg: rgba(255, 107, 107, 0.14);
    --danger-text: #FF9494;
    --warn-bg: rgba(251, 191, 100, 0.14);
    --warn-text: #FBC876;
    --ok-bg: rgba(52, 216, 176, 0.14);
    --ok-text: #5CE0BB;
    --radius: 16px;
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(1100px 560px at 12% -8%, rgba(124, 156, 255, 0.16), transparent 60%),
      radial-gradient(900px 500px at 105% 8%, rgba(185, 140, 242, 0.14), transparent 55%),
      var(--bg-0);
    background-attachment: fixed;
    color: var(--text);
    font-family: var(--font);
    padding: 2.5rem 1.25rem 4rem;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }
  header { margin-bottom: 2rem; }
  h1 {
    font-size: 26px; font-weight: 800; margin: 0 0 6px; text-align: center;
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, #FFFFFF, #B9C4E8);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header p { font-size: 13.5px; color: var(--text-secondary); margin: 0; text-align: center; }
  .status-banner {
    font-family: var(--font-mono); font-size: 11.5px; color: var(--text-muted); margin-top: 14px;
    display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 16px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 20px;
  }
  .card {
    position: relative;
    background:
      linear-gradient(160deg, rgba(255,255,255,0.06), rgba(255,255,255,0.015)),
      var(--card-solid);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.3rem 1.4rem;
    box-shadow: 0 20px 40px -24px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.02) inset;
    overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 3px;
    background: linear-gradient(90deg, var(--card-accent, var(--accent)), transparent 85%);
    opacity: 0.9;
  }
  .card.priority {
    border-color: rgba(255, 107, 107, 0.35);
    box-shadow: 0 20px 44px -20px rgba(255, 90, 90, 0.28), 0 0 0 1px rgba(255,255,255,0.02) inset;
  }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 2px; }
  .card-heading { display: flex; align-items: center; gap: 11px; }
  .avatar {
    width: 38px; height: 38px; border-radius: 11px; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font); font-weight: 700; font-size: 14px; color: #fff;
    background: linear-gradient(135deg, var(--card-accent, var(--accent)), var(--accent-2));
    box-shadow: 0 6px 16px -6px var(--card-accent, var(--accent));
  }
  .card-title { font-size: 16.5px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .meta { font-size: 12px; color: var(--text-secondary); margin: 2px 0 12px; padding-left: 49px; }
  .badge {
    font-size: 10.5px; padding: 3px 10px; border-radius: 20px; white-space: nowrap;
    background: var(--warn-bg); color: var(--warn-text); font-weight: 600;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .badge.danger { background: var(--danger-bg); color: var(--danger-text); }
  .badge.info { background: var(--ok-bg); color: var(--ok-text); }
  .field-label {
    font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-muted); margin: 14px 0 5px; font-weight: 500;
  }
  .field-label-prominent {
    font-size: 11.5px; color: var(--accent); font-weight: 700; letter-spacing: 0.05em;
    margin: 16px 0 6px; padding-bottom: 4px; border-bottom: 2px solid rgba(124,156,255,0.35);
    display: inline-block; text-transform: uppercase; font-family: var(--font-mono);
  }
  textarea, input[type="text"] {
    width: 100%; font-family: var(--font); font-size: 13px; color: var(--text);
    background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 11px; resize: vertical;
  }
  textarea { min-height: 54px; line-height: 1.5; }
  textarea:focus, input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  textarea.lockable {
    background: rgba(255,255,255,0.025); border: 1px solid var(--border); resize: none;
    cursor: default; color: var(--text-secondary);
  }
  textarea.lockable:focus { outline: none; }
  textarea.lockable.unlocked {
    border: 1px solid var(--accent); background: rgba(124,156,255,0.06);
    resize: vertical; cursor: text; color: var(--text);
  }
  textarea.lockable.unlocked:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .update-row {
    display: flex; align-items: center; gap: 8px; margin-top: 14px;
    padding-top: 12px; border-top: 1px dashed var(--border);
  }
  .update-row input[type="date"] {
    font-family: var(--font-mono); font-size: 12.5px; color: var(--text);
    background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 8px; color-scheme: dark;
  }
  .save-btn {
    margin-left: auto; font-family: var(--font); font-size: 12.5px; font-weight: 600;
    color: var(--accent); background: rgba(124,156,255,0.1); border: 1px solid rgba(124,156,255,0.3);
    border-radius: 9px; padding: 7px 14px; cursor: pointer;
  }
  .save-btn:hover { background: rgba(124,156,255,0.18); }
  .save-btn:active { transform: scale(0.98); }
  .last-saved { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-muted); margin-top: 7px; }

  .etapas-toggle {
    margin-top: 16px; padding-top: 13px; border-top: 1px dashed var(--border);
    font-family: var(--font); font-size: 12.5px; font-weight: 600; color: var(--accent-2);
    background: transparent; border-left: none; border-right: none; border-bottom: none;
    border-top: 1px dashed var(--border);
    cursor: pointer; display: flex; align-items: center; gap: 7px; width: 100%;
  }
  .etapas-toggle .chev { transition: transform 0.15s ease; font-size: 11px; }
  .etapas-toggle.open .chev { transform: rotate(90deg); }
  .etapas-body { display: none; margin-top: 12px; }
  .etapas-body.open { display: block; }
  .etapas-edit-label {
    font-family: var(--font-mono); font-size: 10.5px; color: var(--text-muted); margin: 8px 0 5px;
  }
  .etapas-row { display: flex; gap: 10px; align-items: flex-start; }
  .etapas-row textarea { flex: 1; min-height: 90px; font-size: 12.5px; }
  .etapa-atual-field { width: 90px; flex: none; }
  .etapa-atual-field label { display: block; font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 4px; }
  .etapa-atual-field input {
    width: 100%; font-family: var(--font-mono); font-size: 13px; text-align: center; color: var(--text);
    background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 8px; padding: 6px;
  }
  .stepper { list-style: none; margin: 12px 0 0; padding: 0; }
  .stepper li {
    display: flex; align-items: flex-start; gap: 11px; font-size: 12.5px;
    padding: 5px 0; color: var(--text-muted);
  }
  .stepper .dot {
    width: 15px; height: 15px; border-radius: 50%; flex: none; margin-top: 1px;
    border: 1.5px solid var(--border-strong); display: flex; align-items: center;
    justify-content: center; font-size: 9px; color: transparent;
  }
  .stepper li.done { color: var(--text-secondary); text-decoration: line-through; text-decoration-color: var(--border-strong); }
  .stepper li.done .dot { background: var(--ok-text); border-color: var(--ok-text); color: #06231A; }
  .stepper li.current { color: var(--text); font-weight: 700; }
  .stepper li.current .dot { background: var(--warn-text); border-color: var(--warn-text); }

  /* Timeline (diário de acompanhamento) */
  .diario-list { list-style: none; margin: 14px 0 0; padding: 0; }
  .diario-entry {
    position: relative; margin-left: 6px; padding: 11px 13px 11px 22px; margin-bottom: 4px;
    border-left: 2px solid var(--border); font-size: 12.5px;
  }
  .diario-entry:last-child { border-left-color: transparent; padding-bottom: 0; }
  .diario-entry::before {
    content: ""; position: absolute; left: -7px; top: 15px; width: 12px; height: 12px;
    border-radius: 50%; background: var(--dot-color, var(--accent));
    box-shadow: 0 0 0 4px var(--bg-1), 0 0 10px 1px var(--dot-color, var(--accent));
  }
  .diario-entry-body {
    background: rgba(255,255,255,0.035); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 12px;
  }
  .diario-entry-head { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; flex-wrap: wrap; }
  .diario-date { font-family: var(--font-mono); color: var(--text-muted); font-size: 10.5px; }
  .diario-who {
    font-size: 10px; font-weight: 700; padding: 2px 9px; border-radius: 20px;
    background: var(--ok-bg); color: var(--ok-text); letter-spacing: 0.02em;
  }
  .diario-who.jp { background: var(--warn-bg); color: var(--warn-text); }
  .diario-who.luiz { background: var(--danger-bg); color: var(--danger-text); }
  .diario-nota { color: var(--text-secondary); line-height: 1.5; margin: 0; }
  .diario-empty { font-size: 12px; color: var(--text-muted); font-style: italic; padding-left: 6px; }
  .prazo-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
  .prazo-chip {
    font-family: var(--font-mono); font-size: 10.5px; padding: 2px 8px; border-radius: 20px;
    border: 1px solid var(--border-strong); color: var(--text-secondary);
  }
  .prazo-chip.superseded { text-decoration: line-through; color: var(--text-muted); border-color: var(--border); }
  .prazo-chip.current { color: var(--text); border-color: var(--text-secondary); font-weight: 600; }
  .prazo-chip.current.atrasado { color: var(--danger-text); border-color: var(--danger-text); background: var(--danger-bg); }
  .reprogramado-badge {
    font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px;
    background: var(--warn-bg); color: var(--warn-text);
  }
  .prazos-fieldset { margin-top: 8px; }
  .prazos-fieldset .diario-form-label { margin-bottom: 4px; }
  .prazos-inline { display: flex; gap: 8px; }
  .prazos-inline > div { flex: 1; }
  .prazos-inline label { display: block; font-family: var(--font-mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 3px; }

  .diario-form { margin-top: 14px; border-top: 1px dashed var(--border); padding-top: 12px; }
  .diario-form-row { display: flex; gap: 8px; margin-bottom: 9px; }
  .diario-form select {
    font-family: var(--font); font-size: 12.5px; color: var(--text); background: rgba(255,255,255,0.03);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px;
  }
  .diario-form input[type="date"] {
    font-family: var(--font-mono); font-size: 12.5px; color: var(--text); background: rgba(255,255,255,0.03);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; color-scheme: dark;
  }
  .diario-form textarea { min-height: 44px; font-size: 12.5px; }
  .diario-form-label { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); display: block; margin-bottom: 4px; }
  .add-btn {
    font-family: var(--font); font-size: 12.5px; font-weight: 700; color: #0A0E1A;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); border: none;
    border-radius: 9px; padding: 8px 15px; cursor: pointer;
  }
  .add-btn:active { transform: scale(0.98); }
  .admin-row {
    display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 14px; flex-wrap: wrap;
  }
  .admin-state { font-size: 12px; color: var(--text-muted); }
  .admin-btn {
    font-family: var(--font); font-size: 12px; font-weight: 600; color: var(--text-secondary);
    background: rgba(255,255,255,0.04); border: 1px solid var(--border-strong); border-radius: 9px;
    padding: 6px 13px; cursor: pointer;
  }
  .admin-btn.active { color: var(--danger-text); border-color: rgba(255,107,107,0.4); background: var(--danger-bg); }

  .filter-row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; justify-content: center; }
  .filter-btn {
    font-family: var(--font); font-size: 12px; font-weight: 600; color: var(--text-secondary);
    background: rgba(255,255,255,0.03); border: 1px solid var(--border-strong); border-radius: 20px;
    padding: 6px 14px; cursor: pointer;
  }
  .filter-btn:hover { background: rgba(255,255,255,0.07); }
  .filter-btn.active {
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #0A0E1A; border-color: transparent;
  }

  .neg-row { display: flex; align-items: center; gap: 8px; margin: 8px 0 14px; padding-left: 49px; flex-wrap: wrap; }
  .neg-badge {
    font-size: 10.5px; padding: 3px 10px; border-radius: 20px; font-weight: 700; white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .neg-badge.andamento { background: var(--ok-bg); color: var(--ok-text); }
  .neg-badge.finalizado { background: rgba(92, 224, 187, 0.22); color: #8CF5D8; }
  .neg-badge.encerrada { background: rgba(255,255,255,0.08); color: var(--text-muted); }
  .neg-select {
    font-family: var(--font); font-size: 12px; color: var(--text-secondary); background: rgba(255,255,255,0.04);
    border: 1px solid var(--border-strong); border-radius: 7px; padding: 3px 8px; cursor: pointer;
  }
  .neg-select:hover { border-color: var(--accent); }
  .neg-select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .del-entry-btn {
    font-family: var(--font); font-size: 10.5px; color: var(--danger-text); background: transparent;
    border: none; cursor: pointer; padding: 0 0 0 8px;
  }
  .del-entry-btn:hover { text-decoration: underline; }
  .diario-entry-editing .diario-entry-body { border-color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Painel de documentação — Terrenos Carvalho</h1>
    <p>Atualize a posição diária que o Kauã te passa. Cada card salva sozinho no seu navegador.</p>
    <div class="status-banner" id="global-status"></div>
    <div class="admin-row">
      <span class="admin-state" id="admin-state">Modo padrão: qualquer pessoa pode adicionar registros no diário. Status e pendências só o administrador edita.</span>
      <button class="admin-btn" id="admin-toggle" type="button">Entrar como administrador</button>
    </div>
    <div class="filter-row" id="filter-row">
      <button class="filter-btn active" data-filter="todos" type="button">Todos</button>
      <button class="filter-btn" data-filter="andamento" type="button">Em andamento</button>
      <button class="filter-btn" data-filter="finalizado" type="button">Finalizados</button>
      <button class="filter-btn" data-filter="encerrada" type="button">Não avançou</button>
    </div>
  </header>

  <div class="grid" id="grid"></div>
</div>

const globalStatus = document.getElementById("global-status");
const STORAGE_KEY = "terrenos-tracker";
const API_URL = "data.php"; // backend em PHP que grava os dados no servidor (terrenos-data.json)
const ADMIN_PIN = "carvalho2026"; // troque por uma senha sua; só quem souber consegue editar/excluir registros

async function apiGet() {
  const res = await fetch(API_URL, { cache: "no-store" });
  if (!res.ok) throw new Error("Falha ao carregar dados do servidor.");
  const text = await res.text();
  return { key: STORAGE_KEY, value: text };
}

async function apiSet(valueString) {
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: valueString
  });
  if (!res.ok) throw new Error("Falha ao salvar dados no servidor.");
  return { key: STORAGE_KEY, value: valueString };
}
let isAdmin = false;
let saveTimer = null;

function todayISO() {
  return new Date().toISOString().slice(0, 10);
}

function formatDatePt(iso) {
  if (!iso) return "nunca";
  const [y, m, d] = iso.split("-");
  return `${d}/${m}/${y}`;
}

function initials(nome) {
  return nome.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();
}

function makeId() {
  return `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
}

function ensureIds(entries) {
  return (entries || []).map(e => (e.id ? e : { ...e, id: makeId() }));
}

function parseEtapas(raw) {
  return raw.split("\n").map(s => s.trim()).filter(Boolean);
}

const diarioState = {};
const editingState = {};
const negStatusState = {};
const NEG_LABEL = { andamento: "Em andamento", finalizado: "Finalizado", encerrada: "Não avançou" };
const RESP_LABEL = { kaua: "Kauã", jp: "João Paulo", luiz: "Luiz Filippe", outro: "Outro" };

function escapeAttr(str) {
  return String(str).replace(/&/g, "&amp;").replace(/"/g, "&quot;");
}

function renderNegStatus(card, id) {
  const status = negStatusState[id] || "andamento";
  const row = card.querySelector(`[data-negrow="${id}"]`);
  if (!row) return;
  card.dataset.negstatus = status;

  const opts = ["andamento", "finalizado", "encerrada"]
    .map(v => `<option value="${v}" ${v === status ? "selected" : ""}>${NEG_LABEL[v]}</option>`)
    .join("");

  row.innerHTML = `
    <span class="neg-badge ${status}">${NEG_LABEL[status]}</span>
    <select class="neg-select" data-negselect="${id}" aria-label="Situação da negociação">${opts}</select>
  `;
}

async function setNegStatus(id, value) {
  negStatusState[id] = value;
  const card = grid.querySelector(`[data-id="${id}"]`);
  renderNegStatus(card, id);
  applyFilter();
  try {
    const existing = await apiGet().catch(() => null);
    const all = existing && existing.value ? JSON.parse(existing.value) : {};
    all[id] = all[id] || {};
    all[id].negociacao = value;
    const result = await apiSet(JSON.stringify(all));
    globalStatus.textContent = result ? `Negociação marcada como "${NEG_LABEL[value]}".` : "Não foi possível salvar.";
  } catch (err) {
    globalStatus.textContent = "Não foi possível salvar.";
  }
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { globalStatus.textContent = ""; }, 3000);
}

const DOT_COLOR = { kaua: "var(--ok-text)", jp: "var(--warn-text)", luiz: "var(--danger-text)", outro: "var(--text-muted)" };

function renderDiario(card, id) {

    listEl.innerHTML = `<li class="diario-empty">Nenhum registro ainda.</li>`;
    return;
  }
  const today = todayISO();
  listEl.innerHTML = entries.map(e => {
    const dotColor = DOT_COLOR[e.responsavel] || DOT_COLOR.outro;
    if (isAdmin && editingState[id] === e.id) {
      const prazosArr = Array.isArray(e.prazos) ? e.prazos.filter(Boolean) : (e.prazo ? [e.prazo] : []);
      return `
        <li class="diario-entry diario-entry-editing" style="--dot-color:${dotColor}">
        <div class="diario-entry-body">
          <div class="diario-form-row">
            <div>
              <label class="diario-form-label">Responsável</label>
              <select data-edit-field="responsavel">

                <option value="jp" ${e.responsavel === "jp" ? "selected" : ""}>João Paulo</option>
                <option value="luiz" ${e.responsavel === "luiz" ? "selected" : ""}>Luiz Filippe</option>
                <option value="outro" ${e.responsavel === "outro" ? "selected" : ""}>Outro</option>
              </select>
            </div>
            <div>
              <label class="diario-form-label">Data</label>
              <input type="date" data-edit-field="data" value="${escapeAttr(e.data)}">
            </div>
          </div>
          <div class="prazos-fieldset">
            <label class="diario-form-label">Prazos prometidos</label>
            <div class="prazos-inline">
              <div><label>Prazo 1</label><input type="date" data-edit-field="prazo1" value="${escapeAttr(prazosArr[0] || "")}"></div>
              <div><label>Prazo 2</label><input type="date" data-edit-field="prazo2" value="${escapeAttr(prazosArr[1] || "")}"></div>
              <div><label>Prazo 3</label><input type="date" data-edit-field="prazo3" value="${escapeAttr(prazosArr[2] || "")}"></div>
            </div>
          </div>
          <label class="diario-form-label">O que foi dito / combinado</label>

            <button class="admin-btn" data-canceledit="${id}" type="button">Cancelar</button>
            <button class="add-btn" data-saveedit="${id}" data-entryid="${e.id}" type="button">Salvar edição</button>
          </div>
        </div>
        </li>
      `;
    }

    const whoCls = e.responsavel === "jp" ? "jp" : (e.responsavel === "luiz" ? "luiz" : "");
    const whoLabel = RESP_LABEL[e.responsavel] || "Outro";
    const prazos = Array.isArray(e.prazos) ? e.prazos.filter(Boolean) : (e.prazo ? [e.prazo] : []);
    let prazoHTML = "";
    if (prazos.length) {
      const lastIdx = prazos.length - 1;
      const lastAtrasado = prazos[lastIdx] < today;
      const chips = prazos.map((p, i) => {
        const isLast = i === lastIdx;
        const cls = isLast ? `current ${lastAtrasado ? "atrasado" : ""}` : "superseded";
        return `<span class="prazo-chip ${cls}">${formatDatePt(p)}</span>`;
      }).join("");
      const badge = prazos.length > 1 ? `<span class="reprogramado-badge">reprogramado ${prazos.length - 1}x</span>` : "";
      prazoHTML = `<div class="prazo-chips">${chips}${badge}</div>`;

      ? `<button class="del-entry-btn" data-editentry="${id}" data-entryid="${e.id}" type="button" style="color:var(--accent)">Editar</button>

          ${prazoHTML}
        </div>
      </li>
    `;

}

function renderStepper(card, etapas, etapaAtualRaw) {
  const etapaAtual = parseInt(etapaAtualRaw, 10) || 0;
  const stepperEl = card.querySelector("[data-stepper]");
  stepperEl.innerHTML = etapas.map((label, i) => {
    const n = i + 1;
    const cls = n < etapaAtual ? "done" : (n === etapaAtual ? "current" : "");
    const mark = n < etapaAtual ? "✓" : "";
    return `<li class="${cls}"><span class="dot">${mark}</span><span>${label}</span></li>`;
  }).join("");
}

function autosizeLockable(el) {
  el.style.height = "auto";
  el.style.height = el.scrollHeight + "px";
}

  grid.querySelectorAll("textarea.lockable").forEach(el => {
    el.readOnly = !isAdmin;
    el.classList.toggle("unlocked", isAdmin);

    else el.style.height = "";

}

async function loadAll() {
  globalStatus.textContent = "Carregando dados salvos...";
  try {
    const result = await apiGet();
    if (result && result.value) {
      const saved = JSON.parse(result.value);
      TERRENOS.forEach(t => {
        const s = saved[t.id];
        if (!s) return;
        const card = grid.querySelector(`[data-id="${t.id}"]`);
        card.querySelector('[data-field="status"]').value = s.status ?? t.defaults.status;
        card.querySelector('[data-field="cobranca"]').value = s.cobranca ?? t.defaults.cobranca;
        card.querySelector('[data-field="data"]').value = s.data ?? todayISO();
        const etapasText = s.etapas ?? t.defaults.etapas.join("\n");
        const etapaAtual = s.etapaAtual ?? t.defaults.etapaAtual;
        card.querySelector('[data-field="etapas"]').value = etapasText;
        card.querySelector('[data-field="etapaAtual"]').value = etapaAtual;
        renderStepper(card, parseEtapas(etapasText), etapaAtual);
        diarioState[t.id] = ensureIds(Array.isArray(s.diario) ? s.diario : (t.defaults.diario ? t.defaults.diario.slice() : []));
        renderDiario(card, t.id);
        negStatusState[t.id] = s.negociacao ?? t.defaults.negociacao ?? "andamento";
        renderNegStatus(card, t.id);
        const lastSavedEl = card.querySelector(`[data-lastsaved="${t.id}"]`);
        if (s.data) lastSavedEl.textContent = `Atualizado em ${formatDatePt(s.data)}`;
      });
    }
    applyFilter();
    globalStatus.textContent = "";
  } catch (err) {
    globalStatus.textContent = "Nenhum dado salvo ainda — preencha e clique em salvar.";
  }
  applyLockState();
}

async function saveCard(id) {
  const card = grid.querySelector(`[data-id="${id}"]`);
  const status = card.querySelector('[data-field="status"]').value;
  const cobranca = card.querySelector('[data-field="cobranca"]').value;
  const data = card.querySelector('[data-field="data"]').value;
  const etapasText = card.querySelector('[data-field="etapas"]').value;
  const etapaAtual = card.querySelector('[data-field="etapaAtual"]').value;

  try {
    const existing = await apiGet().catch(() => null);
    const all = existing && existing.value ? JSON.parse(existing.value) : {};
    all[id] = { ...(all[id] || {}), status, cobranca, data, etapas: etapasText, etapaAtual, diario: diarioState[id] || [] };
    const result = await apiSet(JSON.stringify(all));
    renderStepper(card, parseEtapas(etapasText), etapaAtual);
    const lastSavedEl = card.querySelector(`[data-lastsaved="${id}"]`);
    if (result) {
      lastSavedEl.textContent = `Atualizado em ${formatDatePt(data)}`;
      globalStatus.textContent = `Salvo: ${card.querySelector(".card-title").textContent}`;
    } else {
      globalStatus.textContent = "Não foi possível salvar. Tente novamente.";
    }
  } catch (err) {
    globalStatus.textContent = "Não foi possível salvar. Tente novamente.";
  }
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { globalStatus.textContent = ""; }, 3000);
}

async function addDiarioEntry(id) {
  const card = grid.querySelector(`[data-id="${id}"]`);
  const responsavel = card.querySelector('[data-diario-field="responsavel"]').value;
  const data = card.querySelector('[data-diario-field="data"]').value || todayISO();
  const prazo1 = card.querySelector('[data-diario-field="prazo1"]').value;
  const prazo2 = card.querySelector('[data-diario-field="prazo2"]').value;
  const prazo3 = card.querySelector('[data-diario-field="prazo3"]').value;
  const prazos = [prazo1, prazo2, prazo3].filter(Boolean);
  const notaEl = card.querySelector('[data-diario-field="nota"]');
  const nota = notaEl.value.trim();

  if (!nota) {
    globalStatus.textContent = "Escreva o que foi combinado antes de adicionar.";
    return;
  }

  const entry = { id: makeId(), responsavel, data, prazos, nota };
  diarioState[id] = diarioState[id] || [];
  diarioState[id].push(entry);
  renderDiario(card, id);
  notaEl.value = "";
  card.querySelector('[data-diario-field="prazo1"]').value = "";
  card.querySelector('[data-diario-field="prazo2"]').value = "";
  card.querySelector('[data-diario-field="prazo3"]').value = "";

  try {
    const existing = await apiGet().catch(() => null);
    const all = existing && existing.value ? JSON.parse(existing.value) : {};
    all[id] = all[id] || {};
    all[id].diario = diarioState[id];
    const result = await apiSet(JSON.stringify(all));
    globalStatus.textContent = result ? `Registro adicionado: ${card.querySelector(".card-title").textContent}` : "Não foi possível salvar o registro.";
  } catch (err) {
    globalStatus.textContent = "Não foi possível salvar o registro.";
  }
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { globalStatus.textContent = ""; }, 3000);
}

function startEditDiarioEntry(id, entryId) {
  editingState[id] = entryId;
  const card = grid.querySelector(`[data-id="${id}"]`);

}

function cancelEditDiarioEntry(id) {
  editingState[id] = null;

  renderDiario(card, id);
}

async function saveDiarioEdit(id, entryId) {
  const card = grid.querySelector(`[data-id="${id}"]`);
  const li = card.querySelector(`[data-saveedit="${id}"]`).closest("li");
  const responsavel = li.querySelector('[data-edit-field="responsavel"]').value;
  const data = li.querySelector('[data-edit-field="data"]').value;
  const prazo1 = li.querySelector('[data-edit-field="prazo1"]').value;
  const prazo2 = li.querySelector('[data-edit-field="prazo2"]').value;
  const prazo3 = li.querySelector('[data-edit-field="prazo3"]').value;
  const nota = li.querySelector('[data-edit-field="nota"]').value.trim();

  if (!nota) {
    globalStatus.textContent = "O texto do registro não pode ficar vazio.";
    return;
  }

  const entries = diarioState[id] || [];
  const idx = entries.findIndex(e => e.id === entryId);
  if (idx === -1) return;
  entries[idx] = {
    ...entries[idx],
    responsavel,
    data: data || entries[idx].data,
    prazos: [prazo1, prazo2, prazo3].filter(Boolean),
    nota
  };

  editingState[id] = null;
  renderDiario(card, id);

  try {
    const existing = await apiGet().catch(() => null);
    const all = existing && existing.value ? JSON.parse(existing.value) : {};
    all[id] = all[id] || {};
    all[id].diario = diarioState[id];
    const result = await apiSet(JSON.stringify(all));
    globalStatus.textContent = result ? "Registro editado." : "Não foi possível salvar a edição.";
  } catch (err) {
    globalStatus.textContent = "Não foi possível salvar a edição.";
  }
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { globalStatus.textContent = ""; }, 3000);
}

async function deleteDiarioEntry(id, entryId) {
  const card = grid.querySelector(`[data-id="${id}"]`);
  diarioState[id] = (diarioState[id] || []).filter(e => e.id !== entryId);
  renderDiario(card, id);
  try {
    const existing = await apiGet().catch(() => null);
    const all = existing && existing.value ? JSON.parse(existing.value) : {};
    all[id] = all[id] || {};
    all[id].diario = diarioState[id];
    await apiSet(JSON.stringify(all));
    globalStatus.textContent = "Registro excluído.";
  } catch (err) {
    globalStatus.textContent = "Não foi possível excluir. Tente novamente.";
  }
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { globalStatus.textContent = ""; }, 3000);
}

    adminToggleBtn.textContent = "Entrar como administrador";
    adminToggleBtn.classList.remove("active");
    adminStateEl.textContent = "Modo padrão: qualquer pessoa pode adicionar registros no diário. Status e pendências só o administrador edita.";
  } else {
    const pin = window.prompt("PIN de administrador:");
    if (pin === null) return;
    if (pin === ADMIN_PIN) {
      isAdmin = true;
      adminToggleBtn.textContent = "Sair do modo administrador";
      adminToggleBtn.classList.add("active");
      adminStateEl.textContent = "Modo administrador ativo: você pode editar status/pendências, editar e excluir registros do diário.";
    } else {
      globalStatus.textContent = "PIN incorreto.";
      if (saveTimer) clearTimeout(saveTimer);
      saveTimer = setTimeout(() => { globalStatus.textContent = ""; }, 3000);
      return;
    }
  }
  applyLockState();
  TERRENOS.forEach(t => {
    const card = grid.querySelector(`[data-id="${t.id}"]`);
    renderDiario(card, t.id);
    renderNegStatus(card, t.id);
  });
});

grid.addEventListener("change", (e) => {
  const negSelect = e.target.closest("[data-negselect]");
  if (negSelect) setNegStatus(negSelect.getAttribute("data-negselect"), negSelect.value);
});

grid.addEventListener("click", (e) => {
  const saveBtn = e.target.closest("[data-save]");
  if (saveBtn) { saveCard(saveBtn.getAttribute("data-save")); return; }

  const toggleBtn = e.target.closest("[data-toggle]");
  if (toggleBtn) {
    const id = toggleBtn.getAttribute("data-toggle");
    const body = grid.querySelector(`[data-etapasbody="${id}"]`);
    toggleBtn.classList.toggle("open");
    body.classList.toggle("open");
    return;
  }

  const addBtn = e.target.closest("[data-adddiario]");
  if (addBtn) { addDiarioEntry(addBtn.getAttribute("data-adddiario")); return; }

  const delBtn = e.target.closest("[data-delentry]");
  if (delBtn) { deleteDiarioEntry(delBtn.getAttribute("data-delentry"), delBtn.getAttribute("data-entryid")); return; }

  const editBtn = e.target.closest("[data-editentry]");
  if (editBtn) { startEditDiarioEntry(editBtn.getAttribute("data-editentry"), editBtn.getAttribute("data-entryid")); return; }

  const cancelBtn = e.target.closest("[data-canceledit]");
  if (cancelBtn) { cancelEditDiarioEntry(cancelBtn.getAttribute("data-canceledit")); return; }

  const saveEditBtn = e.target.closest("[data-saveedit]");
  if (saveEditBtn) saveDiarioEdit(saveEditBtn.getAttribute("data-saveedit"), saveEditBtn.getAttribute("data-entryid"));
});

const filterRow = document.getElementById("filter-row");
filterRow.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-filter]");
  if (!btn) return;
  currentFilter = btn.getAttribute("data-filter");
  filterRow.querySelectorAll(".filter-btn").forEach(b => b.classList.toggle("active", b === btn));
  applyFilter();
});

loadAll();
</script>
</body>
</html>
